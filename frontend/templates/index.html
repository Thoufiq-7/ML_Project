<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Advisor | System</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="parent">
      <div class="div1">
        <h1>Course Engine</h1>
        <div class="search-box">
          <input
            type="text"
            id="courseInput"
            placeholder="Type a course name..."
          />
          <button onclick="getRecs()">Generate</button>
        </div>
      </div>

      <div class="div3">
        <h3>Trending</h3>
        <p>Data Science</p>
        <p>Web Dev</p>
      </div>

      <div class="div4">
        <h3>Filters</h3>
        <span class="badge">Beginner</span>
        <span class="badge">Advanced</span>
      </div>

      <div class="div5">
        <h3>Recommended for You</h3>
        <div id="resultsList" class="netflix-row"></div>
      </div>

      <div class="div2">System Status: Operational</div>
    </div>

    <script>
      async function getRecs() {
        const userId = document.getElementById("userId").value;
        const btn = document.getElementById("submitBtn");
        const list = document.getElementById("resultsList");
        const loader = document.getElementById("loader");

        if (!userId) return alert("Enter an ID");

        // UI State: Loading
        btn.disabled = true;
        loader.classList.remove("hidden");
        list.innerHTML = "";

        try {
          const formData = new FormData();
          formData.append("user_id", userId);

          const response = await fetch("/recommend", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          loader.classList.add("hidden");
          btn.disabled = false;

          if (data.recs && data.recs.length > 0) {
            list.innerHTML = data.recs
              .map(
                (id) => `<li><span class="icon">📚</span> Course ID: ${id}</li>`
              )
              .join("");
          } else {
            list.innerHTML = `<li class="error">No matches found for ID: ${userId}</li>`;
          }
        } catch (err) {
          loader.classList.add("hidden");
          btn.disabled = false;
          list.innerHTML = `<li class="error">Connection Error</li>`;
        }
      }
    </script>
  </body>
</html>

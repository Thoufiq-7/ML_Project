<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Advisor | System</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="parent">
      <div class="div1">
        <h1>Course Engine</h1>
        <div class="search-box">
          <input
            type="text"
            id="courseInput"
            placeholder="Type a course name..."
          />
          <button onclick="getRecs()">Generate</button>
        </div>
      </div>

      <div class="div3">
        <h3>Trending</h3>
        <p>Data Science</p>
        <p>Web Dev</p>
      </div>

      <div class="div4">
        <h3>Filters</h3>
        <span class="badge">Beginner</span>
        <span class="badge">Advanced</span>
      </div>

      <div class="div5">
        <h3>Recommended for You</h3>
        <div id="resultsList" class="netflix-row"></div>
      </div>

      <div class="div2">System Status: Operational</div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>

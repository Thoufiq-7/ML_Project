<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Advisor | System</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="card">
      <header>
        <h1>Course Recommender</h1>
        <p>Enter your ID to see what's next</p>
      </header>

      <div class="input-group">
        <input
          type="text"
          id="userId"
          placeholder="Enter a Course you liked (e.g. Machine Learning)"
        />
        <button onclick="getRecs()" id="submitBtn">Generate</button>
      </div>

      <div id="loader" class="hidden">Scanning patterns...</div>

      <div class="results-container">
        <h3>Recommendations:</h3>
        <ul id="resultsList">
          <li class="placeholder">Results will appear here</li>
        </ul>
      </div>
    </div>

    <script>
      async function getRecs() {
        const userId = document.getElementById("userId").value;
        const btn = document.getElementById("submitBtn");
        const list = document.getElementById("resultsList");
        const loader = document.getElementById("loader");

        if (!userId) return alert("Enter an ID");

        // UI State: Loading
        btn.disabled = true;
        loader.classList.remove("hidden");
        list.innerHTML = "";

        try {
          const formData = new FormData();
          formData.append("user_id", userId);

          const response = await fetch("/recommend", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          loader.classList.add("hidden");
          btn.disabled = false;

          if (data.recs && data.recs.length > 0) {
            list.innerHTML = data.recs
              .map(
                (id) => `<li><span class="icon">📚</span> Course ID: ${id}</li>`
              )
              .join("");
          } else {
            list.innerHTML = `<li class="error">No matches found for ID: ${userId}</li>`;
          }
        } catch (err) {
          loader.classList.add("hidden");
          btn.disabled = false;
          list.innerHTML = `<li class="error">Connection Error</li>`;
        }
      }
    </script>
  </body>
</html>
